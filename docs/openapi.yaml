openapi: 3.0.3
info:
  title: Mentor Hub mentor API
  description: |
    A Flask + MongoDB API for the mentor service.
    
    ## Authentication
    All endpoints (except `/metrics`) require JWT authentication via the `Authorization` header:
    ```
    Authorization: Bearer <token>
    ```
    
    For local development, obtain a JWT from the Developer Edition welcome / IdP flow, or use a
    test token from `test/e2e/e2e_auth.py` that matches your `JWT_SECRET` and expected claims.
  version: 0.1.0
  contact:
    name: Mentor Forge
    email: info@agile-learning-institute.com
  license:
    name: Apache-2.0

servers:
  - url: http://localhost:8391
    description: Local development server

tags:
  - name: Config
    description: Configuration endpoints
  - name: Metrics
    description: Monitoring endpoints
  - name: Resource
    description: Resource operations (create, read, update)
  - name: Path
    description: Path operations (create, read, update)
  - name: Plan
    description: Plan operations (create, read, update)
  - name: Encounter
    description: Encounter operations (create, read, update)
  - name: Event
    description: Event operations (create, read)
  - name: Profile
    description: Profile operations (read-only)
  - name: Mentee
    description: Mentee notes operations (read, update)
  - name: Aggregation
    description: Resource aggregation metrics and related notes (read)
paths:
  /api/config:
    get:
      tags:
        - Config
      summary: Get configuration
      description: Returns the current configuration as JSON (requires authentication)
      operationId: getConfig
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Configuration retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  config_items:
                    type: array
                    items:
                      type: object
                  versions:
                    type: array
                    items:
                      type: object
                  enumerators:
                    type: array
                    items:
                      type: object
                  token:
                    type: object
        '401':
          description: Unauthorized - Invalid or missing token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /metrics:
    get:
      tags:
        - Metrics
      summary: Prometheus metrics
      description: Returns Prometheus-formatted metrics
      operationId: getMetrics
      responses:
        '200':
          description: Metrics retrieved successfully
          content:
            text/plain:
              schema:
                type: string

  /api/aggregation/{resource_id}:
    get:
      tags:
        - Aggregation
      summary: Get Resource aggregation detail by resource ID
      description: |
        Retrieve Resource_Aggregation metrics and related Notes for a resource.
        When no aggregation document exists for the resource, one is created with zeroed counters.
        Any authenticated token holder may read.
      operationId: getAggregationDetail
      security:
        - bearerAuth: []
      parameters:
        - name: resource_id
          in: path
          required: true
          description: The Resource ID (MongoDB ObjectId)
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
            example: 507f1f77bcf86cd799439011
      responses:
        '200':
          description: Successfully retrieved aggregation detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AggregationDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/resource:
    get:
      tags:
        - Resource
      summary: Get all Resource documents
      description: >-
        Return a paginated array of Resource documents. Pagination uses the
        `offset`/`size` request headers; ordering uses the `sort_by`/`order`
        query params (default name asc); filters are query params. The response
        body is a plain array; pagination metadata is returned via
        `X-Pagination-*` response headers.
      operationId: getResources
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OffsetHeader'
        - $ref: '#/components/parameters/SizeHeader'
        - $ref: '#/components/parameters/SortByParam'
        - $ref: '#/components/parameters/OrderParam'
        - name: name
          in: query
          required: false
          description: Optional name filter (partial, case-insensitive)
          schema:
            type: string
            example: my-Resource
        - name: description
          in: query
          required: false
          description: Optional description filter (partial, case-insensitive)
          schema:
            type: string
        - name: status
          in: query
          required: false
          description: Optional comma-separated status filter (exact match, any-of)
          schema:
            type: string
            example: active,draft
      responses:
        '200':
          description: Successfully retrieved matching documents
          headers:
            X-Pagination-Offset:
              $ref: '#/components/headers/X-Pagination-Offset'
            X-Pagination-Size:
              $ref: '#/components/headers/X-Pagination-Size'
            X-Pagination-Returned:
              $ref: '#/components/headers/X-Pagination-Returned'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Resource'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags:
        - Resource
      summary: Create a new Resource document
      description: Create a new Resource document (requires staff or admin role)
      operationId: createResource
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceInput'
      responses:
        '201':
          description: Resource created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  _id:
                    type: string
                    pattern: '^[0-9a-fA-F]{24}$'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/resource/{ResourceId}:
    get:
      tags:
        - Resource
      summary: Get Resource by ResourceId
      description: Retrieve a specific Resource document by its ResourceId
      operationId: getResource
      security:
        - bearerAuth: []
      parameters:
        - name: ResourceId
          in: path
          required: true
          description: The Resource ID (MongoDB ObjectId)
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
            example: 507f1f77bcf86cd799439011
      responses:
        '200':
          description: Successfully retrieved Resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resource'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags:
        - Resource
      summary: Update Resource document
      description: Update a Resource document (requires admin role). Cannot update _id, created, or saved fields.
      operationId: updateResource
      security:
        - bearerAuth: []
      parameters:
        - name: ResourceId
          in: path
          required: true
          description: The Resource ID (MongoDB ObjectId)
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
            example: 507f1f77bcf86cd799439011
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceUpdate'
      responses:
        '200':
          description: Resource updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resource'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/path:
    get:
      tags:
        - Path
      summary: Get all Path documents
      description: >-
        Return a paginated array of Path documents. Pagination uses the
        `offset`/`size` request headers; ordering uses the `sort_by`/`order`
        query params (default name asc); `name` is an optional partial,
        case-insensitive filter. The response body is a plain array; pagination
        metadata is returned via `X-Pagination-*` response headers.
      operationId: getPaths
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OffsetHeader'
        - $ref: '#/components/parameters/SizeHeader'
        - $ref: '#/components/parameters/SortByParam'
        - $ref: '#/components/parameters/OrderParam'
        - name: name
          in: query
          required: false
          description: Optional name filter (partial, case-insensitive)
          schema:
            type: string
            example: my-Path
      responses:
        '200':
          description: Successfully retrieved matching Path documents
          headers:
            X-Pagination-Offset:
              $ref: '#/components/headers/X-Pagination-Offset'
            X-Pagination-Size:
              $ref: '#/components/headers/X-Pagination-Size'
            X-Pagination-Returned:
              $ref: '#/components/headers/X-Pagination-Returned'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Path'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags:
        - Path
      summary: Create a new Path document
      description: Create a new Path document (requires staff or admin role)
      operationId: createPath
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PathInput'
      responses:
        '201':
          description: Path created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  _id:
                    type: string
                    pattern: '^[0-9a-fA-F]{24}$'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/path/{PathId}:
    get:
      tags:
        - Path
      summary: Get Path by PathId
      description: Retrieve a specific Path document by its PathId. Readable by any authenticated caller (no role restriction).
      operationId: getPath
      security:
        - bearerAuth: []
      parameters:
        - name: PathId
          in: path
          required: true
          description: The Path ID (MongoDB ObjectId)
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
            example: 507f1f77bcf86cd799439011
      responses:
        '200':
          description: Successfully retrieved the Path document
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Path'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags:
        - Path
      summary: Update Path document
      description: Update a Path document (requires mentor or admin role). Cannot update _id, created, or saved fields.
      operationId: updatePath
      security:
        - bearerAuth: []
      parameters:
        - name: PathId
          in: path
          required: true
          description: The Path ID (MongoDB ObjectId)
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
            example: 507f1f77bcf86cd799439011
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PathUpdate'
      responses:
        '200':
          description: Path updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Path'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/plan:
    get:
      tags:
        - Plan
      summary: Get all Plan documents
      description: >-
        Return a paginated array of Plan documents. Pagination uses the
        `offset`/`size` request headers; ordering uses the `sort_by`/`order`
        query params (default name asc); `name` is an optional partial,
        case-insensitive filter. The response body is a plain array; pagination
        metadata is returned via `X-Pagination-*` response headers.
      operationId: getPlans
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OffsetHeader'
        - $ref: '#/components/parameters/SizeHeader'
        - $ref: '#/components/parameters/SortByParam'
        - $ref: '#/components/parameters/OrderParam'
        - name: name
          in: query
          required: false
          description: Optional name filter (partial, case-insensitive)
          schema:
            type: string
            example: intro
      responses:
        '200':
          description: Successfully retrieved matching Plan documents
          headers:
            X-Pagination-Offset:
              $ref: '#/components/headers/X-Pagination-Offset'
            X-Pagination-Size:
              $ref: '#/components/headers/X-Pagination-Size'
            X-Pagination-Returned:
              $ref: '#/components/headers/X-Pagination-Returned'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Plan'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags:
        - Plan
      summary: Create a new Plan document
      description: Create a new Plan document (requires staff or admin role)
      operationId: createPlan
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanInput'
      responses:
        '201':
          description: Plan created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  _id:
                    type: string
                    pattern: '^[0-9a-fA-F]{24}$'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/plan/{PlanId}:
    get:
      tags:
        - Plan
      summary: Get Plan by PlanId
      description: Retrieve a specific Plan document by its PlanId
      operationId: getPlan
      security:
        - bearerAuth: []
      parameters:
        - name: PlanId
          in: path
          required: true
          description: The Plan ID (MongoDB ObjectId)
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
            example: 507f1f77bcf86cd799439011
      responses:
        '200':
          description: Successfully retrieved Plan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plan'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags:
        - Plan
      summary: Update Plan document
      description: Update a Plan document (requires admin role). Cannot update _id, created, or saved fields.
      operationId: updatePlan
      security:
        - bearerAuth: []
      parameters:
        - name: PlanId
          in: path
          required: true
          description: The Plan ID (MongoDB ObjectId)
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
            example: 507f1f77bcf86cd799439011
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanUpdate'
      responses:
        '200':
          description: Plan updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plan'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/encounter:
    post:
      tags:
        - Encounter
      summary: Create a new Encounter document
      description: |
        Create a new Encounter document (requires the `mentor` or `admin` role).
        The `mentor_id`, `mentee_id`, and `plan_id` fields are **required**. The
        server auto-fills the `agenda` from the referenced Plan's `checklist`
        (one agenda item per checklist step, each initialized as unchecked), so
        the client must **not** send `agenda`.
      operationId: createEncounter
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EncounterInput'
      responses:
        '201':
          description: Encounter created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  _id:
                    type: string
                    pattern: '^[0-9a-fA-F]{24}$'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/encounter/{EncounterId}:
    get:
      tags:
        - Encounter
      summary: Get Encounter by EncounterId
      description: |
        Retrieve a specific Encounter document by its EncounterId. Read access is
        open: any `mentor` or `admin` may read any encounter (no ownership check).
      operationId: getEncounter
      security:
        - bearerAuth: []
      parameters:
        - name: EncounterId
          in: path
          required: true
          description: The Encounter ID (MongoDB ObjectId)
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
            example: 507f1f77bcf86cd799439011
      responses:
        '200':
          description: Successfully retrieved Encounter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Encounter'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags:
        - Encounter
      summary: Update Encounter document
      description: |
        Update an Encounter document. The caller must be an `admin` **or** the
        mentor who owns the encounter (the caller's Profile `_id` equals the
        encounter's `mentor_id`); other mentors receive `403`. Cannot update _id,
        created, or saved fields.
      operationId: updateEncounter
      security:
        - bearerAuth: []
      parameters:
        - name: EncounterId
          in: path
          required: true
          description: The Encounter ID (MongoDB ObjectId)
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
            example: 507f1f77bcf86cd799439011
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EncounterUpdate'
      responses:
        '200':
          description: Encounter updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Encounter'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/event:
    get:
      tags:
        - Event
      summary: Get all Event documents
      description: >-
        Return a paginated array of Event documents. Pagination uses the
        `offset`/`size` request headers; ordering uses the `sort_by`/`order`
        query params (default created.at_time desc). `type` is an optional
        comma-separated filter and `profile_id` scopes on context.profile_id.
        The response body is a plain array; pagination metadata is returned via
        `X-Pagination-*` response headers.
      operationId: getEvents
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OffsetHeader'
        - $ref: '#/components/parameters/SizeHeader'
        - $ref: '#/components/parameters/SortByParam'
        - $ref: '#/components/parameters/OrderParam'
        - name: type
          in: query
          required: false
          description: Optional comma-separated event type filter (exact match, any-of)
          schema:
            type: string
            example: login,logout
        - name: profile_id
          in: query
          required: false
          description: Optional scope on context.profile_id (MongoDB ObjectId)
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
            example: 507f1f77bcf86cd799439011
      responses:
        '200':
          description: Successfully retrieved Events
          headers:
            X-Pagination-Offset:
              $ref: '#/components/headers/X-Pagination-Offset'
            X-Pagination-Size:
              $ref: '#/components/headers/X-Pagination-Size'
            X-Pagination-Returned:
              $ref: '#/components/headers/X-Pagination-Returned'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Event'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags:
        - Event
      summary: Create a new Event document
      description: Create a new Event document (requires staff or admin role)
      operationId: createEvent
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventInput'
      responses:
        '201':
          description: Event created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  _id:
                    type: string
                    pattern: '^[0-9a-fA-F]{24}$'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/event/{EventId}:
    get:
      tags:
        - Event
      summary: Get Event by EventId
      description: Retrieve a specific Event document by its EventId
      operationId: getEvent
      security:
        - bearerAuth: []
      parameters:
        - name: EventId
          in: path
          required: true
          description: The Event ID (MongoDB ObjectId)
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
            example: 507f1f77bcf86cd799439011
      responses:
        '200':
          description: Successfully retrieved Event
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/profile:
    get:
      tags:
        - Profile
      summary: Get the Mentor Dashboard profiles
      description: |
        Returns the Mentor Dashboard (requires the `mentor` or `admin` role): the set of mentee Profiles assigned to the
        current user (resolved from the JWT token's identity — Profiles whose
        `mentor_id` matches the caller). This is a read-only, non-paginated
        endpoint that always returns the full set in a pre-determined order, so
        it accepts no filter, sort, or pagination parameters.

        Each item combines basic Profile information (`_id`, `name`,
        `description`), the mentee's learning-journey progress (the number of
        resources in their Library, Now, and Next scopes), and the summary of
        their most recent Encounter.
      operationId: getProfiles
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Successfully retrieved the Mentor Dashboard profiles
          content:
            application/json:
              schema:
                type: array
                description: Mentee dashboard cards for the current mentor, in a pre-determined order
                items:
                  $ref: '#/components/schemas/MentorDashboardProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/profile/{ProfileId}/properties:
    get:
      tags:
        - Profile
      summary: Get mentee Properties hub (aggregated activity)
      description: |
        Returns an aggregated read-only view for the mentor **Properties** hub
        for a single mentee Profile. Requires the `mentor` or `admin` role.
      operationId: getProfileProperties
      security:
        - bearerAuth: []
      parameters:
        - name: ProfileId
          in: path
          required: true
          description: The mentee Profile ID (MongoDB ObjectId)
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
            example: 507f1f77bcf86cd799439011
      responses:
        '200':
          description: Successfully retrieved mentee properties
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfilePropertiesResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/profile/{ProfileId}:
    get:
      tags:
        - Profile
      summary: Get Profile detail by ProfileId
      description: |
        Retrieve the composite detail for a specific mentee Profile (read-only).
        Requires the `mentor` or `admin` role. The response combines the Profile document,
        the mentee notes document, and the full list of Encounters for the mentee.
      operationId: getProfile
      security:
        - bearerAuth: []
      parameters:
        - name: ProfileId
          in: path
          required: true
          description: The Profile ID (MongoDB ObjectId)
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
            example: 507f1f77bcf86cd799439011
      responses:
        '200':
          description: Successfully retrieved Profile detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/mentee/{profile_id}:
    get:
      tags:
        - Mentee
      summary: Get Mentee notes by profile_id
      description: |
        Retrieve the mentee notes document for the given mentee Profile id
        (requires the `mentor` or `admin` role). If no mentee document exists yet for the
        Profile, a default document is created and returned so the UI always
        receives a valid document.
      operationId: getMentee
      security:
        - bearerAuth: []
      parameters:
        - name: profile_id
          in: path
          required: true
          description: The mentee Profile ID (MongoDB ObjectId)
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
            example: 507f1f77bcf86cd799439011
      responses:
        '200':
          description: Successfully retrieved Mentee notes document
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mentee'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/mentee/{mentee_id}:
    patch:
      tags:
        - Mentee
      summary: Update Mentee notes document
      description: Update a Mentee notes document (requires the `mentor` or `admin` role). Cannot update _id, created, or saved fields.
      operationId: updateMentee
      security:
        - bearerAuth: []
      parameters:
        - name: mentee_id
          in: path
          required: true
          description: The Mentee document ID (MongoDB ObjectId)
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
            example: 507f1f77bcf86cd799439011
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MenteeUpdate'
      responses:
        '200':
          description: Mentee notes document updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mentee'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT issued by your identity provider (Developer Edition welcome flow for local dev).
        Include the token in the Authorization header: `Bearer <token>`

  parameters:
    ObjectId:
      name: controlId
      in: path
      required: true
      description: MongoDB ObjectId
      schema:
        type: string
        pattern: '^[0-9a-fA-F]{24}$'
        example: 507f1f77bcf86cd799439011

    OffsetHeader:
      name: offset
      in: header
      required: false
      description: Zero-based index of the first item to return (pagination).
      schema:
        type: integer
        minimum: 0
        default: 0
        example: 0
    SizeHeader:
      name: size
      in: header
      required: false
      description: Maximum number of items to return (page size, max 100).
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
        example: 20
    SortByParam:
      name: sort_by
      in: query
      required: false
      description: Field to sort by (validated against the endpoint's allowed set).
      schema:
        type: string
    OrderParam:
      name: order
      in: query
      required: false
      description: Sort order.
      schema:
        type: string
        enum: [asc, desc]

  headers:
    X-Pagination-Offset:
      description: The offset applied to this list response.
      schema:
        type: integer
        example: 0
    X-Pagination-Size:
      description: The page size applied to this list response.
      schema:
        type: integer
        example: 20
    X-Pagination-Returned:
      description: The number of items returned in this response.
      schema:
        type: integer
        example: 20

  responses:
    BadRequest:
      description: Bad Request - Invalid request parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Unauthorized - Invalid or missing token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Forbidden - Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: Error message
          example: Unauthorized

    Breadcrumb:
      type: object
      description: Audit trail information
      additionalProperties: false
      required:
        - from_ip
        - by_user
        - at_time
        - correlation_id
      properties:
        from_ip:
          type: string
          format: ip
          description: HTTP request remote IP address
          example: 192.168.1.1
        at_time:
          type: string
          format: date-time
          description: Timestamp of the action
          example: "2024-01-15T10:00:00Z"
        by_user:
          type: string
          description: User ID who performed the action
          pattern: '^[^\s]{1,40}$'
          example: user-123
        correlation_id:
          type: string
          description: Logging correlation ID
          pattern: '^[^\s]{1,40}$'
          example: corr-abc123

    Resource:
      type: object
      description: A learning resource (link)
      additionalProperties: false
      required:
        - _id
        - name
        - created
        - saved
      properties:
        _id:
          type: string
          description: The unique identifier for the Resource.
          pattern: '^[0-9a-fA-F]{24}$'
          example: 507f1f77bcf86cd799439011
        name:
          type: string
          description: The searchable name of the document
          pattern: '^[^\s]{1,40}$'
          example: my-Resource
        description:
          type: string
          description: The description of the Resource.
          pattern: '^[^\t\n]{0,255}$'
          example: A sample Resource document
        url:
          type: string
          format: uri
          description: The link for the resource
          example: https://example.com/resource
        status:
          type: string
          description: Status of the document
          enum:
            - active
            - failed
          example: active
        interests:
          type: array
          description: A list of interests this resource is related to
          items:
            type: string
            enum:
              - api
              - data
              - design
              - games
              - iot
              - robot
              - sre
              - ux
        technologies:
          type: array
          description: A list of technologies this resource covers
          items:
            type: string
            enum:
              - CSS
              - HTML
              - Java
              - MongoDB
              - Other
              - Python
              - React
              - TypeScript
        last_verified:
          type: string
          format: date-time
          description: When was this resource link last verified
          example: "2024-01-15T10:00:00Z"
        note_count:
          type: integer
          description: The number of notes this resource has
          minimum: 1
        rating_count:
          type: integer
          description: The number of raitings this resource has
          minimum: 1
        rating_sum:
          type: integer
          description: The sum of all resource ratings for this resource
          minimum: 1
        created:
          $ref: '#/components/schemas/Breadcrumb'
        saved:
          $ref: '#/components/schemas/Breadcrumb'

