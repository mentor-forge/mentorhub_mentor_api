    ProfileDetail:
      type: object
      description: |
        Composite Profile detail returned by `GET /api/profile/{ProfileId}`.
        Combines the mentee's Profile document, the mentee notes document, and
        the full list of the mentee's Encounters.
      additionalProperties: false
      required:
        - profile
        - mentee
        - encounters
      properties:
        profile:
          $ref: '#/components/schemas/Profile'
        mentee:
          $ref: '#/components/schemas/Mentee'
        encounters:
          type: array
          description: The mentee's Encounters
          items:
            $ref: '#/components/schemas/Encounter'

    StatusSummary:
      type: object
      description: Cross-domain status counts for the mentee Properties hub.
      additionalProperties: false
      required:
        - library_count
        - now_count
        - next_count
        - encounters_count
        - resources_engaged
      properties:
        profile_status:
          type: string
        journey_status:
          type: string
        library_count:
          type: integer
          minimum: 0
        now_count:
          type: integer
          minimum: 0
        next_count:
          type: integer
          minimum: 0
        encounters_count:
          type: integer
          minimum: 0
        resources_engaged:
          type: integer
          minimum: 0
        last_activity_at:
          type: string
          format: date-time
          nullable: true

    SiteAndLink:
      type: object
      additionalProperties: false
      required:
        - resource_id
        - name
        - scope
      properties:
        resource_id:
          type: string
          pattern: '^[0-9a-fA-F]{24}$'
        name:
          type: string
        url:
          type: string
          format: uri
        scope:
          type: string
          enum: [library, now, next]
        used:
          type: integer
          minimum: 0
        started:
          type: string
          format: date-time
        completed:
          type: string
          format: date-time

    MentorHistoryEntry:
      type: object
      additionalProperties: false
      required:
        - mentor_id
        - encounter_count
      properties:
        mentor_id:
          type: string
          pattern: '^[0-9a-fA-F]{24}$'
        mentor_name:
          type: string
        encounter_count:
          type: integer
          minimum: 0
        first_date:
          type: string
          format: date-time
        last_date:
          type: string
          format: date-time

    ResourceUsageEntry:
      type: object
      additionalProperties: false
      required:
        - resource_id
        - name
        - times_used
        - status
      properties:
        resource_id:
          type: string
          pattern: '^[0-9a-fA-F]{24}$'
        name:
          type: string
        times_used:
          type: integer
          minimum: 0
        status:
          type: string
          enum: [completed, in_progress, queued]

    CelebrationEntry:
      type: object
      additionalProperties: false
      required:
        - resource_id
        - name
        - completed_at
      properties:
        resource_id:
          type: string
          pattern: '^[0-9a-fA-F]{24}$'
        name:
          type: string
        completed_at:
          type: string
          format: date-time

    ProfilePropertiesResponse:
      type: object
      description: Aggregated mentee activity for the mentor Properties hub.
