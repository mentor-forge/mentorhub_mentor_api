        mentor_history:
          type: array
          items:
            $ref: '#/components/schemas/MentorHistoryEntry'
        journey:
          type: object
          nullable: true
        path:
          type: object
          nullable: true
        resource_usage:
          type: array
          items:
            $ref: '#/components/schemas/ResourceUsageEntry'
        celebrations:
          type: array
          items:
            $ref: '#/components/schemas/CelebrationEntry'

    MentorDashboardProfile:
      type: object
      description: |
        A single mentee card on the Mentor Dashboard. Combines basic Profile
        information with derived learning-journey progress and the summary of
        the mentee's most recent encounter. All derived fields are computed at
        read time and are not stored on the Profile document.
      additionalProperties: false
      required:
        - _id
        - name
        - progress
      properties:
        _id:
          type: string
          description: The Profile _id of the mentee
          pattern: '^[0-9a-fA-F]{24}$'
          example: 507f1f77bcf86cd799439011
        name:
          type: string
          description: The mentee's profile name (IdP username)
          pattern: '^[^\s]{1,40}$'
          example: my-Profile
        description:
          type: string
          description: The comment the mentee added to their profile
          pattern: '^[^\t\n]{0,255}$'
          example: A sample Profile document
        progress:
          $ref: '#/components/schemas/JourneyProgress'
        last_encounter:
          $ref: '#/components/schemas/RecentEncounterSummary'

    JourneyProgress:
      type: object
      description: |
        Resource counts for the mentee's active Learning Journey, one count per
        scope. Derived from the Journey document's `library`, `now`, and `next`
        arrays.
      additionalProperties: false
      required:
        - library
        - now
        - next
      properties:
        library:
          type: integer
          description: Number of resources in the Library (started/completed) scope
          minimum: 0
          example: 12
        now:
          type: integer
          description: Number of resources currently being worked on (Now scope)
          minimum: 0
          example: 3
        next:
          type: integer
          description: Number of resources queued up Next (total resource entries across all Next topics)
          minimum: 0
          example: 5

    RecentEncounterSummary:
      type: object
      description: |
        Summary of the mentee's most recent Encounter. Null when the mentee has
        no recorded encounters yet.
      nullable: true
      additionalProperties: false
      properties:
        _id:
          type: string
          description: The Encounter _id
          pattern: '^[0-9a-fA-F]{24}$'
          example: 507f1f77bcf86cd799439011
        date:
          type: string
          format: date-time
          description: When the encounter occurred
          example: "2024-01-15T10:00:00Z"
        tldr:
          type: string
          description: A one sentence summary of the encounter
          pattern: '^[^\t\n]{0,255}$'
        summary:
          type: string
          description: A brief summary of the transcript
          maxLength: 4096

    Note:
      type: object
      description: A note about a resource
      additionalProperties: false
      properties:
        _id:
          type: string
          description: The unique identifier for the Note
          pattern: '^[0-9a-fA-F]{24}$'
          example: 507f1f77bcf86cd799439011
        resource_id:
          type: string
          description: The Resource ID this note is for
          pattern: '^[0-9a-fA-F]{24}$'
          example: 507f1f77bcf86cd799439011
        profile_id:
          type: string
          description: The Profile ID of the person who took this note
          pattern: '^[0-9a-fA-F]{24}$'
          example: 507f1f77bcf86cd799439011
        note:
          type: string
          description: The text of the note
          maxLength: 4096
          example: Found this resource very helpful for learning async patterns.
        status:
          type: string
          description: Status of the document
          enum:
            - active
            - archived
          example: active
        created:
          $ref: '#/components/schemas/Breadcrumb'
        saved:
          $ref: '#/components/schemas/Breadcrumb'

    ResourceAggregation:
      type: object
      description: Resource level rating and note count metrics
      additionalProperties: false
      required:
        - _id
        - resource_id
        - rating_sum
        - created
        - last_saved
      properties:
        _id:
          type: string
          description: A unique identifier for Resource_Aggregation
          pattern: '^[0-9a-fA-F]{24}$'
          example: 507f1f77bcf86cd799439011
        resource_id:
          type: string
          description: The Resource that is rated
          pattern: '^[0-9a-fA-F]{24}$'
          example: 507f1f77bcf86cd799439011
        note_count:
          type: integer
          minimum: 0
          description: The number of notes left on this resource
          example: 3
        completions:
          type: integer
          minimum: 0
          description: The number of times this resource has been completed
          example: 5
        hits:
          type: integer
          minimum: 0
          description: The number of times this URL has been clicked
          example: 12
        duration:
          type: string
          description: The total duration of all completions (ISO 8601 duration)
          pattern: '^P(?!$)(\d+Y)?(\d+M)?(\d+W)?(\d+D)?(T(\d+H)?(\d+M)?(\d+(\.\d+)?S)?)?$'
          example: PT2H30M
        rating_count:
          type: integer
          minimum: 0
          description: The number of ratings (should equal completions)
          example: 5
        rating_sum:
          type: integer
          minimum: 0
          description: The sum of all ratings
          example: 20
        created:
          $ref: '#/components/schemas/Breadcrumb'
        last_saved:
          $ref: '#/components/schemas/Breadcrumb'

    AggregationDetail:
      type: object
      description: Composite aggregation view (metrics + related notes)
      additionalProperties: false
      required:
        - aggregation
        - notes
      properties:
        aggregation:
          $ref: '#/components/schemas/ResourceAggregation'
        notes:
          type: array
          description: Notes related to this resource
          items:
            $ref: '#/components/schemas/Note'