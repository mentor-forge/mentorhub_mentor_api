          description: The unique identifier for the Profile.
          pattern: '^[0-9a-fA-F]{24}$'
          example: 507f1f77bcf86cd799439011
        name:
          type: string
          description: The IDP Username used in JWT Claims
          pattern: '^[^\s]{1,40}$'
          example: my-Profile
        full_name:
          type: string
          description: Display name from intake (distinct from IdP username)
          pattern: '^[^\t\n]{0,255}$'
          example: Jane Doe
        description:
          type: string
          description: A Comment the user adds to their profile
          pattern: '^[^\t\n]{0,255}$'
          example: A sample Profile document
        email:
          type: string
          description: The users email address
          pattern: '^[^\s@]+@[^\s@]+\.[^\s@]+$'
          example: user@example.com
        email_verified:
          type: boolean
          description: Has the user verified this email
        mentor_id:
          type: string
          description: The _id of this persons Mentor
          pattern: '^[0-9a-fA-F]{24}$'
          example: 507f1f77bcf86cd799439011
        status:
          type: string
          description: Status of the document
          enum:
            - active
            - archived
            - suspended
          example: active
        interests:
          type: array
          description: A list of topics this person is interested in
          items:
            type: string
            enum:
              - api
              - data
              - design
              - games
              - iot
              - robot
              - sre
              - ux
        goals:
          type: array
          description: 'The goals set by a user '
          items:
            type: string
            pattern: '^[^\t\n]{0,255}$'
        experience:
          type: array
          description: Work History - newest to oldest
          items:
            type: object
            additionalProperties: false
            properties:
              company:
                type: string
                description: The Company Name
                pattern: '^[^\t\n]{0,255}$'
              roles:
                type: array
                description: The roles this person filled at this company
                items:
                  type: object
                  additionalProperties: false
                  properties:
                    title:
                      type: string
                      description: Te Job Title
                      pattern: '^[^\t\n]{0,255}$'
                    description:
                      type: string
                      description: Description of the work, projects, responsibilities
                      maxLength: 4096
                    start:
                      type: string
                      format: date-time
                      description: Start Date
                    end:
                      type: string
                      format: date-time
                      description: End Date
                    technologies:
                      type: array
                      description: Technologies Used
                      items:
                        type: string
                        enum:
                          - CSS
                          - HTML
                          - Java
                          - MongoDB
                          - Other
                          - Python
                          - React
                          - TypeScript
        created:
          $ref: '#/components/schemas/Breadcrumb'
        saved:
          $ref: '#/components/schemas/Breadcrumb'

    Mentee:
      type: object
      description: Mentor notes about a Mentee
      additionalProperties: false
      required:
        - _id
        - created
        - saved
      properties:
        _id:
          type: string
          description: The unique identifier for the Mentee document.
          pattern: '^[0-9a-fA-F]{24}$'
          example: 507f1f77bcf86cd799439011
        name:
          type: string
          description: Searchable name for this mentoring record
          pattern: '^[^\s]{1,40}$'
          example: my-Mentee
        profile_id:
          type: string
          description: The _id of the related mentee Profile document
          pattern: '^[0-9a-fA-F]{24}$'
          example: 507f1f77bcf86cd799439011
        status:
          type: string
          description: Status of the document
          enum:
            - active
            - archived
          example: active
        description:
          type: string
          description: Short summary of the mentoring relationship
          pattern: '^[^\t\n]{0,255}$'
          example: A sample Mentee notes document
        focus:
          type: string
          description: Current mentoring focus for upcoming sessions
          pattern: '^[^\t\n]{0,255}$'
        homework:
          type: string
          description: Follow-up items or homework assigned to the mentee
          maxLength: 4096
        notes:
          type: string
          description: Mentor notes about this mentee (shared across mentors over time)
          maxLength: 4096
        next_appointment:
          type: string
          format: date-time
          description: The next scheduled appointment date and time
        schedule:
          type: object
          additionalProperties: false
          description: Recurring appointment schedule for mentor and mentee meetings
          properties:
            repeats:
              type: integer
              description: Meeting repeats every N weeks
              minimum: 1
            starting:
              type: string
              format: date-time
              description: When meetings begin
        created:
          $ref: '#/components/schemas/Breadcrumb'
        saved:
          $ref: '#/components/schemas/Breadcrumb'

    MenteeUpdate:
      type: object
      description: Fields to update in a Mentee notes document (cannot include _id, created, saved)
      properties:
        name:
          type: string
          description: Searchable name for this mentoring record
          pattern: '^[^\s]{1,40}$'
        profile_id:
          type: string
          description: The _id of the related mentee Profile document
          pattern: '^[0-9a-fA-F]{24}$'
        status:
          type: string
          description: Status of the document
          enum:
            - active
            - archived
        description:
          type: string
          description: Short summary of the mentoring relationship
          pattern: '^[^\t\n]{0,255}$'
        focus:
          type: string
          description: Current mentoring focus for upcoming sessions
          pattern: '^[^\t\n]{0,255}$'
        homework:
          type: string
          description: Follow-up items or homework assigned to the mentee
          maxLength: 4096
        notes:
          type: string
          description: Mentor notes about this mentee (shared across mentors over time)
          maxLength: 4096
        next_appointment:
          type: string
          format: date-time
          description: The next scheduled appointment date and time
        schedule:
          type: object
          additionalProperties: false
          description: Recurring appointment schedule for mentor and mentee meetings
          properties:
            repeats:
              type: integer
              description: Meeting repeats every N weeks
              minimum: 1
            starting:
              type: string
              format: date-time
